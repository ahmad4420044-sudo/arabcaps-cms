<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#2196F3"/>
<title>ARABCAPS — نظام إدارة المعايرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#2196F3;--primary-dark:#1565C0;--primary-light:#E3F2FD;
  --success:#4CAF50;--success-light:#E8F5E9;--success-dark:#2E7D32;
  --warning:#FF9800;--warning-light:#FFF3E0;--warning-dark:#E65100;
  --danger:#F44336;--danger-light:#FFEBEE;--danger-dark:#C62828;
  --purple:#9C27B0;--purple-light:#F3E5F5;--purple-dark:#6A1B9A;
  --bg:#F0F4F8;--card:#FFFFFF;--border:#DDE3ED;
  --text:#1A2332;--text2:#5A6A7E;--text3:#8A9BB0;
}
body{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;font-size:14px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#CCD;border-radius:2px}
.em{font-family:"Noto Color Emoji","Segoe UI Emoji","Apple Color Emoji",sans-serif}
input[type="date"]{-webkit-appearance:textfield;text-align:center}
input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer}
.hidden{display:none!important}
/* LOGIN */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1565C0,#42A5F5);padding:20px}
.login-card{background:#fff;border-radius:20px;padding:36px 28px;width:320px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center}
.login-logo{width:68px;height:68px;background:linear-gradient(135deg,#1565C0,#2196F3);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:30px;box-shadow:0 8px 24px rgba(33,150,243,.35)}
.login-title{font-size:20px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:12px;color:#8A9BB0;margin-bottom:24px}
.pw-input{width:100%;padding:12px 14px;border:2px solid #DDE3ED;border-radius:12px;font-size:18px;text-align:center;letter-spacing:8px;color:#1A2332;background:#F8FAFC;font-family:monospace;transition:.2s;margin-bottom:8px}
.pw-input:focus{outline:none;border-color:#2196F3;background:#fff}
.pw-error{color:#F44336;font-size:12px;margin-bottom:8px;min-height:18px}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#1565C0,#2196F3);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(33,150,243,.4)}
.login-hint{font-size:11px;color:#B0BEC5;margin-top:10px}
/* HEADER */
.app-header{background:#fff;border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.hdr-logo{width:34px;height:34px;background:linear-gradient(135deg,#1565C0,#2196F3);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex-shrink:0}
.hdr-info{flex:1}
.hdr-title{font-size:13px;font-weight:700}
.hdr-sub{font-size:10px;color:#8A9BB0}
.hdr-actions{display:flex;gap:5px}
.icon-btn{min-width:44px;height:44px;padding:2px 6px;border-radius:9px;border:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text2);transition:.15s;flex-shrink:0;gap:1px}
.icon-btn:hover{background:var(--primary-light);color:var(--primary)}
.icon-btn .ib-label{font-size:8px;font-weight:600;line-height:1;white-space:nowrap}
.app-header{flex-wrap:wrap}
.hdr-actions{flex-wrap:wrap;justify-content:flex-end}
/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.07)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 2px;cursor:pointer;color:var(--text3);transition:.15s;border:none;background:none;font-family:inherit;gap:2px}
.nav-item.active{color:var(--primary)}
.nav-icon{font-size:18px;line-height:1}
.nav-label{font-size:9px;font-weight:500}
.nav-badge{position:absolute;top:5px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:8px;min-width:14px;text-align:center}
/* MAIN */
.main-content{padding:10px 10px 78px}
/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.card-title{font-size:12px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}
.stat-card{background:var(--card);border-radius:12px;padding:11px 12px;cursor:pointer;transition:.15s;border-right:4px solid transparent}
.stat-card.green{border-color:var(--success)}
.stat-card.blue{border-color:var(--primary)}
.stat-card.orange{border-color:var(--warning)}
.stat-card.red{border-color:var(--danger)}
.stat-card.purple{border-color:var(--purple)}
.stat-card.gray{border-color:#90A4AE}
.stat-label{font-size:10px;color:var(--text2);margin-bottom:4px}
.stat-num{font-size:26px;font-weight:700}
.stat-num.green{color:var(--success-dark)}
.stat-num.blue{color:var(--primary-dark)}
.stat-num.orange{color:var(--warning-dark)}
.stat-num.red{color:var(--danger-dark)}
.stat-num.purple{color:var(--purple-dark)}
.stat-sub{font-size:10px;color:var(--text3);margin-top:2px}
/* MONTHS */
.months-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.month-card{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:8px 6px;cursor:pointer;transition:.2s;text-align:center}
.month-card:hover,.month-card.active{border-color:var(--primary);background:var(--primary-light)}
.month-card.completed{border-color:var(--success);background:var(--success-light)}
.month-card.overdue{border-color:var(--danger);background:var(--danger-light)}
.month-card.current{box-shadow:0 0 0 3px rgba(33,150,243,.25)}
.month-name{font-size:11px;font-weight:600}
.month-prog{font-size:9px;color:var(--text2);margin-top:2px}
.month-bar{height:3px;background:#E8EDF3;border-radius:2px;margin-top:4px;overflow:hidden}
.month-fill{height:100%;border-radius:2px}
/* SECTION */
.section-block{margin-bottom:8px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.section-hdr{background:#EEF2F7;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.section-name{font-size:12px;font-weight:600}
.section-meta{font-size:10px;color:var(--text2);display:flex;gap:6px;align-items:center}
/* TABLE */
.tbl-wrap{overflow-x:auto;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#F5F7FA;padding:7px 9px;text-align:right;font-size:10px;font-weight:600;color:var(--text2);white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:7px 9px;border-bottom:1px solid #F0F4F8;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFC}
.code-cell{font-family:monospace;font-size:10px;color:var(--text3);direction:ltr;text-align:left}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.b-done{background:var(--success-light);color:var(--success-dark)}
.b-pending{background:var(--primary-light);color:var(--primary-dark)}
.b-due{background:var(--warning-light);color:var(--warning-dark)}
.b-late{background:var(--danger-light);color:var(--danger-dark)}
.b-faulty{background:var(--purple-light);color:var(--purple-dark)}
/* BUTTONS */
.btn{padding:7px 12px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:12px;font-weight:500;font-family:inherit;color:var(--text);display:inline-flex;align-items:center;gap:4px;transition:.15s}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-success:hover{background:var(--success-dark)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger-light)}
.btn-warning{background:var(--warning);color:#fff;border-color:var(--warning)}
.btn-sm{padding:4px 9px;font-size:11px;border-radius:7px}
.btn-xs{padding:3px 7px;font-size:10px;border-radius:6px}
.btn-block{width:100%;justify-content:center}
/* SEARCH */
.search-wrap{position:relative;margin-bottom:8px}
.search-input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;background:var(--card);color:var(--text);font-family:inherit}
.search-input:focus{outline:none;border-color:var(--primary)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
/* FILTER */
.filter-row{display:flex;gap:5px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.filter-chip{flex-shrink:0;padding:5px 10px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:11px;font-weight:500;color:var(--text2);font-family:inherit;white-space:nowrap}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:16px;transform:translateY(100%);transition:.3s cubic-bezier(.4,0,.2,1)}
.modal-overlay.open .modal-box{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:#DDE3ED;border-radius:2px;margin:0 auto 14px}
.modal-title{font-size:15px;font-weight:700;margin-bottom:14px}
.form-group{margin-bottom:10px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;color:var(--text);background:var(--card);font-family:inherit}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-footer{display:flex;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.modal-footer .btn{flex:1;justify-content:center}
/* PHOTOS */
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.photo-slot{aspect-ratio:1;border:2px dashed var(--border);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);font-size:10px;gap:2px;overflow:hidden;position:relative;background:#F8FAFC}
.photo-slot:hover{border-color:var(--primary);color:var(--primary)}
.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-del{position:absolute;top:2px;left:2px;background:var(--danger);color:#fff;border:none;border-radius:4px;width:18px;height:18px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
/* QUOTE */
.quote-paper{background:#fff;padding:20px;font-size:12px;line-height:1.9;direction:rtl;border:1px solid var(--border);border-radius:10px}
.quote-paper h3{text-align:center;color:var(--primary-dark);font-size:14px;margin-bottom:10px}
.quote-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:11px}
.quote-tbl th,.quote-tbl td{border:1px solid #bbb;padding:5px 7px;text-align:center}
.quote-tbl th{background:#E3F2FD;font-weight:600}
/* TOAST */
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(10px);background:#1A2332;color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;z-index:999;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* PROGRESS */
.prog-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.prog-label{font-size:11px;color:var(--text2);min-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-bar{flex:1;height:5px;background:#E8EDF3;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px}
.prog-val{font-size:10px;color:var(--text3);min-width:30px;text-align:left}
/* TRANSFER */
.transfer-list{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:9px}
.transfer-item{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid #F0F4F8;cursor:pointer}
.transfer-item:last-child{border-bottom:none}
.transfer-item:hover{background:#F8FAFC}
.t-check{width:17px;height:17px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px}
.transfer-item.sel .t-check{background:var(--primary);border-color:var(--primary);color:#fff}
/* SETTINGS */
.set-section{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px}
.set-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #F0F4F8;cursor:pointer}
.set-item:last-child{border-bottom:none}
.set-item:hover{background:#FAFBFC}
.set-left{display:flex;align-items:center;gap:9px}
.set-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.set-name{font-size:13px;font-weight:500}
.set-desc{font-size:10px;color:var(--text3)}
/* EMPTY */
.empty-state{text-align:center;padding:36px 16px;color:var(--text3)}
.empty-icon{font-size:44px;margin-bottom:10px}
.empty-text{font-size:12px}
/* MANAGER BANNER */
.mgr-banner{background:linear-gradient(135deg,#1565C0,#2196F3);color:#fff;padding:8px 14px;text-align:center;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
@media(min-width:600px){
  .stats-grid{grid-template-columns:repeat(3,1fr)}
  .months-grid{grid-template-columns:repeat(4,1fr)}
  .modal-overlay{align-items:center}
  .modal-box{border-radius:18px;max-width:520px;margin:auto;max-height:85vh}
  .form-grid{grid-template-columns:1fr 1fr}
}
@media print{.app-header,.bottom-nav,.no-print{display:none!important}.main-content{padding:0}body{background:#fff}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page" class="login-page">
  <div class="login-card">
    <div class="login-logo" id="login-logo">⚙️</div>
    <div class="login-title" id="login-title">ARABCAPS</div>
    <div class="login-sub">نظام إدارة المعايرة</div>
    <input type="password" id="pw-input" class="pw-input" placeholder="••••" maxlength="8"/>
    <div id="pw-error" class="pw-error"></div>
    <button class="btn-login" onclick="doLogin()">دخول — أدمن</button>
    <button class="btn-login" onclick="enterManagerView()" style="margin-top:8px;background:linear-gradient(135deg,#37474F,#546E7A)">👁️ عرض المدير</button>
    <div class="login-hint">كلمة سر الأدمن: ****</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="main-app" class="hidden">
  <!-- MANAGER BANNER -->
  <div id="mgr-banner" class="mgr-banner hidden">👁️ وضع العرض للمدير — قراءة فقط &nbsp;|&nbsp; <span style="cursor:pointer;text-decoration:underline;opacity:.8" onclick="exitManagerView()">خروج ↩</span></div>
  
  <!-- HEADER -->
  <div class="app-header">
    <div class="hdr-logo" id="hdr-logo">⚙️</div>
    <div class="hdr-info">
      <div class="hdr-title">نظام إدارة المعايرة</div>
      <div id="hdr-sub" class="hdr-sub">ARABCAPS — 2026</div>
      <div id="sync-status" style="font-size:9px;color:var(--text3)">⏳ جاري الاتصال...</div>
    </div>
    <div class="hdr-actions">
      <button class="icon-btn" onclick="openView('search')" title="بحث"><span class="em">🔍</span><span class="ib-label">بحث</span></button>
      <button class="icon-btn" onclick="openView('quote')" title="طلب عرض سعر"><span class="em">📤</span><span class="ib-label">طلب عرض سعر</span></button>
      <button class="icon-btn" onclick="openView('missingcerts')" title="طلب شهادات لم تأتِ بعد"><span class="em">📸</span><span class="ib-label">طلب شهادات</span></button>
      <button class="icon-btn" onclick="openView('history')" title="سجل المطبوعات"><span class="em">🗂️</span><span class="ib-label">سجل الطباعة</span></button>
      <button class="icon-btn" onclick="window.print()" title="طباعة الصفحة الحالية"><span class="em">🖨️</span><span class="ib-label">طباعة</span></button>
      <button class="icon-btn" onclick="promptManagerView()" title="تبديل وضع المدير" id="mgr-toggle-btn"><span class="em">👁️</span><span class="ib-label">عرض المدير</span></button>
    </div>
  </div>

  <!-- VIEWS -->
  <div class="main-content">
    <!-- DASHBOARD -->
    <div id="view-dashboard" class="view"></div>
    <!-- MONTHLY -->
    <div id="view-monthly" class="view hidden"></div>
    <!-- SEARCH/ALL -->
    <div id="view-search" class="view hidden"></div>
    <!-- TRANSFER -->
    <div id="view-transfer" class="view hidden"></div>
    <!-- ARCHIVE -->
    <div id="view-archive" class="view hidden"></div>
    <!-- SETTINGS -->
    <div id="view-settings" class="view hidden"></div>
    <!-- FAULTY -->
    <div id="view-faulty" class="view hidden"></div>
    <!-- INSTRUCTION -->
    <div id="view-instruction" class="view hidden"></div>
    <!-- QUOTE -->
    <div id="view-quote" class="view hidden"></div>
    <div id="view-missingcerts" class="view hidden"></div>
    <div id="view-history" class="view hidden"></div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="openView('dashboard',this)" id="nav-dashboard">
      <span class="nav-icon">📊</span><span class="nav-label">الرئيسية</span>
    </button>
    <button class="nav-item" onclick="openView('monthly',this)" id="nav-monthly">
      <span class="nav-icon">📅</span><span class="nav-label">الجدول</span>
    </button>
    <button class="nav-item" onclick="openView('transfer',this)" id="nav-transfer">
      <span class="nav-icon">🔄</span><span class="nav-label">ترحيل</span>
    </button>
    <button class="nav-item" onclick="openView('faulty',this)" id="nav-faulty">
      <span class="nav-icon">🔧</span><span class="nav-label">معطلة</span>
    </button>
    <button class="nav-item" onclick="openView('archive',this)" id="nav-archive">
      <span class="nav-icon">📦</span><span class="nav-label">أرشيف</span>
    </button>
    <button class="nav-item" onclick="openSettingsGuarded(this)" id="nav-settings">
      <span class="nav-icon">⚙️</span><span class="nav-label">إعدادات</span>
    </button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- MODALS -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal-box" id="modal-box">
    <div class="modal-handle"></div>
    <div id="modal-content"></div>
  </div>
</div>
<script>
// ========== SIMPLE DOMAIN LOCK ==========
(function(){
  const ALLOWED_HOSTS = ['ahmad4420044-sudo.github.io'];
  const protocol = window.location.protocol;
  const isWebProtocol = (protocol === 'http:' || protocol === 'https:');
  const host = window.location.hostname;
  // Only block when actually served over the web from an unrecognized domain.
  // Opening the file directly (file://, content://, etc.) for local testing is always allowed.

let fbApp = null, fbDb = null, fbRef = null;
let fbReady = false;
let fbApplyingRemote = false; // guard against write-loop when applying a remote update
let fbSyncTimer = null;

function initFirebase() {
  try {
    if (typeof firebase === 'undefined') { console.warn('Firebase SDK not loaded — working offline only'); return; }
    fbApp = firebase.initializeApp(firebaseConfig);
    fbDb = firebase.database();
    fbDb.enablePersistence && true; // realtime database has built-in offline cache automatically
    fbRef = fbDb.ref('cms_data');
    fbReady = true;

    // Show live connection status (works even without opening any specific view)
    fbDb.ref('.info/connected').on('value', (snap) => {
      const el = document.getElementById('sync-status');
      if (!el) return;
      if (snap.val() === true) el.innerHTML = '🟢 متصل ومتزامن';
      else el.innerHTML = '🔴 غير متصل — يعمل محلياً';
    });

    // Listen for remote changes (from any device) and apply them locally in realtime
    fbRef.on('value', (snapshot) => {
      const remote = snapshot.val();
      if (!remote) {
        // Nothing on the server yet (truly first run ever) — push our current local copy once to seed it
        pushToFirebase();
        return;
      }
      fbApplyingRemote = true;
      state.instruments = remote.instruments || state.instruments;
      state.faulty = remote.faulty || state.faulty;
      state.archive = remote.archive || state.archive;
      state.settings = { ...state.settings, ...(remote.settings || {}) };
      state.nextId = remote.nextId || state.nextId;
      state.printHistory = remote.printHistory || state.printHistory;
      // Persist the freshly-synced data locally too, so offline mode has the latest copy
      persistLocalOnly();
      fbApplyingRemote = false;
      // Re-render whatever is currently visible so changes show instantly
      if (document.getElementById('main-app') && !document.getElementById('main-app').classList.contains('hidden')) {
        applyBranding();
        render(state.currentView);
      }
    }, (err) => { console.warn('Firebase sync error (working offline):', err); });
  } catch(e) { console.warn('Firebase init failed — working offline only:', e); }
}

function pushToFirebase() {
  if (!fbReady || fbApplyingRemote) return;
  clearTimeout(fbSyncTimer);
  // Debounce rapid successive saves into one network write
  fbSyncTimer = setTimeout(() => {
    try {
      fbRef.set({
        instruments: state.instruments,
        faulty: state.faulty,
        archive: state.archive,
        settings: state.settings,
        nextId: state.nextId,
        printHistory: state.printHistory
      });
    } catch(e) { /* offline — Firebase SDK queues it automatically and sends when back online */ }
  }, 400);
}

// ========== INIT ==========
async function init() {
  loadFromStorage();
  if (!state.instruments.length) initFromRawData();
  initFirebase(); // attach the realtime listener FIRST so remote data (if any) wins over stale local data
  autoMarkPastMonths();
  autoArchive();
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('main-app').classList.add('hidden');
  applyBranding();
  document.getElementById('pw-input').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
}

function initFromRawData() {
  const now = new Date(); const cm = now.getMonth()+1; const cy = now.getFullYear();
  state.instruments = RAW_DATA.map((d, i) => ({
    id: i+1,
    section: d[0], item: d[1], location: d[2], month: d[3], code: d[4],
    year: 2026,
    status: (d[3] < cm && cy >= 2026) ? 'done' : (d[3] === cm ? 'due' : 'pending'),
    executedDate: (d[3] < cm && cy >= 2026) ? `${cy}-0${d[3]<10?'0':''}${d[3]}-01` : '',
    notes: '', addedBy: 'system'
  }));
  state.nextId = RAW_DATA.length + 1;
  saveToStorage();
}

function autoMarkPastMonths() {
  const now = new Date(); const cm = now.getMonth()+1; const cy = now.getFullYear();
  let changed = false;
  state.instruments.forEach(inst => {
    if (inst.year === cy && inst.month < cm && inst.status !== 'done') {
      inst.status = 'done';
      if (!inst.executedDate) inst.executedDate = `${cy}-${String(inst.month).padStart(2,'0')}-01`;
      changed = true;
    }
    if (inst.year === cy && inst.month === cm && inst.status === 'pending') {
      inst.status = 'due';
      changed = true;
    }
  });
  if (changed) persistLocalOnly(); // local-only: do NOT push to Firebase automatically on every app open
}

// Archive: keep current year + 1 previous. When new year starts, previous-2 gets deleted.
function autoArchive() {
  const cy = state.settings.currentYear;
  // Move completed months of previous year to archive
  const prevYear = cy - 1;
  const prevInsts = state.instruments.filter(i => i.year === prevYear);
  if (prevInsts.length > 0) {
    if (!state.archive[prevYear]) state.archive[prevYear] = {};
    prevInsts.forEach(inst => {
      const m = String(inst.month);
      if (!state.archive[prevYear][m]) state.archive[prevYear][m] = [];
      if (!state.archive[prevYear][m].find(a => a.id === inst.id)) {
        state.archive[prevYear][m].push({...inst});
      }
    });
    state.instruments = state.instruments.filter(i => i.year !== prevYear);
  }
  // Delete archives older than 1 year back (keep only prevYear)
  Object.keys(state.archive).forEach(yr => {
    if (parseInt(yr) < prevYear) delete state.archive[yr];
  });
  persistLocalOnly(); // local-only: do NOT push to Firebase automatically on every app open
}

// ========== STORAGE ==========
function persistLocalOnly() {
  try {
    const data = { instruments: state.instruments, faulty: state.faulty, archive: state.archive, settings: state.settings, nextId: state.nextId, printHistory: state.printHistory };
    localStorage.setItem('arabcaps_cms_v3', JSON.stringify(data));
    localStorage.setItem('arabcaps_cms_photos', JSON.stringify(state.photos));
  } catch(e) { console.warn('Storage full:', e); }
}

function saveToStorage() {
  persistLocalOnly();
  // Also push to Firebase (shared database) — works online, and queues automatically while offline
  pushToFirebase();
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem('arabcaps_cms_v3');
    if (raw) {
      const data = JSON.parse(raw);
      state.instruments = data.instruments || [];
      state.faulty = data.faulty || [];
      state.archive = data.archive || {};
      state.settings = {...state.settings, ...data.settings};
      state.nextId = data.nextId || 10000;
      state.printHistory = data.printHistory || [];
    }
    const photos = localStorage.getItem('arabcaps_cms_photos');
    if (photos) state.photos = JSON.parse(photos);
  } catch(e) {}
}

// ========== AUTH ==========
async function hashStr(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  const h = await hashStr(pw);
  const err = document.getElementById('pw-error');
  if (h === state.settings.adminPw) {
    state.isManager = false;
    showApp(); err.textContent='';
  } else {
    err.textContent = '❌ كلمة السر غلط';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
  }
}

function applyBranding() {
  const nameEl = document.getElementById('hdr-sub');
  if (nameEl) nameEl.textContent = `${state.settings.companyName||'ARABCAPS'} — ${state.settings.currentYear}`;
  const logoEl = document.getElementById('hdr-logo');
  if (logoEl) {
    if (state.settings.companyLogo) {
      logoEl.innerHTML = `<img src="${state.settings.companyLogo}" style="width:100%;height:100%;object-fit:contain;border-radius:9px"/>`;
    } else {
      logoEl.innerHTML = '⚙️';
    }
  }
  const loginLogo = document.getElementById('login-logo');
  if (loginLogo) {
    if (state.settings.companyLogo) {
      loginLogo.innerHTML = `<img src="${state.settings.companyLogo}" style="width:100%;height:100%;object-fit:contain;border-radius:18px"/>`;
    } else {
      loginLogo.innerHTML = '⚙️';
    }
  }
  const loginTitle = document.getElementById('login-title');
  if (loginTitle) loginTitle.textContent = state.settings.companyName || 'ARABCAPS';
}

function showApp() {
  document.getElementById('login-page').style.display='none';
  document.getElementById('main-app').classList.remove('hidden');
  document.getElementById('mgr-banner').classList.toggle('hidden', !state.isManager);
  document.getElementById('pw-input').value='';
  applyBranding();
  openView('dashboard');
}

function doLogout() {
  state.isManager = false;
  settingsUnlocked = false;
  document.getElementById('main-app').classList.add('hidden');
  document.getElementById('login-page').style.display='flex';
  document.getElementById('pw-input').value='';
  document.getElementById('pw-input').focus();
}

function promptManagerView() {
  state.isManager = !state.isManager;
  document.getElementById('mgr-banner').classList.toggle('hidden', !state.isManager);
  toast(state.isManager ? '👁️ وضع المدير — قراءة فقط' : '✅ تم الخروج من وضع المدير');
  render(state.currentView);
}

function enterManagerView() {
  state.isManager = true;
  document.getElementById('login-page').style.display='none';
  document.getElementById('main-app').classList.remove('hidden');
  document.getElementById('mgr-banner').classList.remove('hidden');
  openView('dashboard');
}

function exitManagerView() {
  state.isManager = false;
  document.getElementById('main-app').classList.add('hidden');
  document.getElementById('login-page').style.display='flex';
  document.getElementById('mgr-banner').classList.add('hidden');
}

// ========== VIEWS ==========
function openView(name, navEl) {
  state.currentView = name;
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  const el = document.getElementById('view-'+name);
  if (el) { el.classList.remove('hidden'); render(name); }
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navTarget = navEl || document.getElementById('nav-'+name);
  if (navTarget) navTarget.classList.add('active');
}

function render(name) {
  const fns = {
    dashboard: renderDashboard,
    monthly: renderMonthly,
    search: renderSearch,
    transfer: renderTransfer,
    archive: renderArchive,
    settings: renderSettings,
    faulty: renderFaulty,
    instruction: renderInstruction,
    quote: renderQuote,
    missingcerts: renderMissingCerts,
    history: renderHistory
  };
  if (fns[name]) fns[name]();
}

// ========== DASHBOARD ==========
function renderDashboard() {
  const now = new Date(); const cm = now.getMonth()+1; const cy = state.settings.currentYear;
  const insts = state.instruments;
  const total = insts.length;
  const done = insts.filter(i=>i.status==='done').length;
  const late = insts.filter(i=>i.status==='late').length;
  const due = insts.filter(i=>i.status==='due').length;
  const pending = insts.filter(i=>i.status==='pending').length;
  const faulty = state.faulty.length;
  const pct = total ? Math.round(done/total*100) : 0;

  let months12 = '';
  for (let m=1; m<=12; m++) {
    const mi = insts.filter(i=>i.month===m);
    const md = mi.filter(i=>i.status==='done').length;
    const mp = mi.length ? Math.round(md/mi.length*100) : 0;
    const isCur = m===cm;
    const isLate = m<cm && mp<100;
    const isDone = mp===100 && mi.length>0;
    let cls = isCur?'current':'';
    if (isDone) cls+=' completed';
    else if (isLate) cls+=' overdue';
    const fillClr = isDone?'var(--success)':isLate?'var(--danger)':isCur?'var(--primary)':'var(--primary)';
    months12 += `<div class="month-card ${cls}" onclick="selMonth(${m})">
      <div class="month-name">${MONTHS_AR[m]}</div>
      <div class="month-prog">${md}/${mi.length}</div>
      <div class="month-bar"><div class="month-fill" style="width:${mp}%;background:${fillClr}"></div></div>
    </div>`;
  }

  // Progress by section
  const sections = [...new Set(insts.map(i=>i.section))].sort();
  let secRows = sections.map(s=>{
    const si = insts.filter(i=>i.section===s);
    const sd = si.filter(i=>i.status==='done').length;
    const sp = si.length?Math.round(sd/si.length*100):0;
    const clr = sp===100?'var(--success)':sp>0?'var(--primary)':'var(--danger)';
    return `<div class="prog-row">
      <div class="prog-label" title="${s}">${s}</div>
      <div class="prog-bar"><div class="prog-fill" style="width:${sp}%;background:${clr}"></div></div>
      <div class="prog-val">${sd}/${si.length}</div>
    </div>`;
  }).join('');

  document.getElementById('view-dashboard').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card blue" onclick="openViewFilter('search','all')"><div class="stat-label">إجمالي الأجهزة</div><div class="stat-num blue">${total}</div><div class="stat-sub">جهاز مسجّل</div></div>
      <div class="stat-card green" onclick="openViewFilter('search','done')"><div class="stat-label">✅ تم التنفيذ</div><div class="stat-num green">${done}</div><div class="stat-sub">${pct}% مكتمل</div></div>
      <div class="stat-card orange" onclick="openViewFilter('search','due')"><div class="stat-label">⏰ مستحق الشهر</div><div class="stat-num orange">${due}</div><div class="stat-sub">${MONTHS_AR[cm]}</div></div>
      <div class="stat-card red" onclick="openViewFilter('search','late')"><div class="stat-label">⚠️ متأخر</div><div class="stat-num red">${late}</div><div class="stat-sub">يحتاج متابعة</div></div>
      <div class="stat-card purple" onclick="openView('faulty')"><div class="stat-label">🔧 معطل</div><div class="stat-num purple">${faulty}</div><div class="stat-sub">خارج الخدمة</div></div>
      <div class="stat-card gray" onclick="openViewFilter('search','pending')"><div class="stat-label">⏳ لم يتم بعد</div><div class="stat-num">${pending}</div><div class="stat-sub">قادم</div></div>
    </div>
    <div class="card">
      <div class="card-title">📅 الأشهر — ${cy}
        ${!state.isManager?`<button class="btn btn-xs btn-primary" onclick="addNewYear()">+ سنة جديدة</button>`:''}
      </div>
      <div class="months-grid">${months12}</div>
    </div>
    <div class="card">
      <div class="card-title">📊 التقدم حسب القسم</div>
      <div>${secRows}</div>
    </div>
  `;
}

function selMonth(m) {
  state.currentMonth = m;
  openView('monthly', document.getElementById('nav-monthly'));
}

function openViewFilter(view, status) {
  state.searchStatus = status;
  openView(view, document.getElementById('nav-'+view));
}

// ========== MONTHLY ==========
let collapsedSections = new Set();

function renderMonthly() {
  const m = state.currentMonth;
  const cy = state.settings.currentYear;
  const now = new Date(); const cm = now.getMonth()+1;
  const mInsts = state.instruments.filter(i=>i.month===m && i.year===cy);
  const done = mInsts.filter(i=>i.status==='done').length;
  const sections = [...new Set(mInsts.map(i=>i.section))].sort();
  const isManager = state.isManager;
  const isPast = m < cm;

  // Month selector
  let monthBtns = '';
  for(let mo=1;mo<=12;mo++){
    const mi=state.instruments.filter(i=>i.month===mo&&i.year===cy);
    const md=mi.filter(i=>i.status==='done').length;
    const pct=mi.length?Math.round(md/mi.length*100):0;
    monthBtns+=`<button class="filter-chip ${mo===m?'active':''}" onclick="state.currentMonth=${mo};renderMonthly()">${MONTHS_AR[mo]} (${md}/${mi.length})</button>`;
  }

  let sectionsHtml = '';
  sections.forEach(sec => {
    const si = mInsts.filter(i=>i.section===sec);
    const sd = si.filter(i=>i.status==='done').length;
    const isCollapsed = collapsedSections.has(sec);
    let rows = si.map((inst,idx) => `
      <tr>
        <td style="color:var(--text3);width:28px">${idx+1}</td>
        <td>
          <div style="font-weight:500;font-size:12px">${inst.item}</div>
          <div style="font-size:10px;color:var(--text3)">${inst.location}</div>
        </td>
        <td class="code-cell">${inst.code}</td>
        <td><span class="badge ${STATUS_CFG[inst.status]?.cls||'b-pending'}">${STATUS_CFG[inst.status]?.label||inst.status}</span></td>
        <td>
          ${inst.status==='done'
            ? `<span style="font-size:11px;color:var(--success-dark)">✓ ${inst.executedDate||''}</span>`
            : (!isManager?`<input type="date" style="font-size:11px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;background:#F8FAFC" value="${inst.executedDate||''}" onchange="markDone(${inst.id},this.value)">`:'—')
          }
        </td>
        ${!isManager?`<td>
          <div style="display:flex;gap:3px">
            <button class="btn btn-xs" onclick="openInstModal(${inst.id})">✏️</button>
            <button class="btn btn-xs" onclick="toggleCertReceived(${inst.id})" title="الشهادة وصلت" style="${inst.certReceived?'background:var(--success-light);border-color:var(--success);color:var(--success-dark)':''}">${inst.certReceived?'✅ شهادة':'⬜ شهادة'}</button>
            <button class="btn btn-xs" onclick="openPhotos(${inst.id})" title="صورة (اختياري)" style="${hasPhoto(inst.id)?'background:var(--success-light);border-color:var(--success)':''}">📷${hasPhoto(inst.id)?' ✓':''}</button>
            <button class="btn btn-xs btn-danger" onclick="markFaulty(${inst.id})" title="معطل">🔧</button>
            <button class="btn btn-xs btn-danger" onclick="quickDeleteInst(${inst.id})" title="حذف الجهاز">🗑</button>
          </div>
        </td>`:'<td></td>'}
      </tr>`).join('');

    sectionsHtml += `
      <div class="section-block">
        <div class="section-hdr" onclick="toggleSection('${sec.replace(/'/g,"\\'")}')">
          <div class="section-name">${sec}</div>
          <div class="section-meta">
            <span class="badge b-done">${sd}/${si.length}</span>
            <span>${isCollapsed?'▶':'▼'}</span>
          </div>
        </div>
        <div id="sec-${btoa(unescape(encodeURIComponent(sec))).replace(/[^a-zA-Z0-9]/g,'')}" ${isCollapsed?'style="display:none"':''}>
          <div class="tbl-wrap">
            <table>
              <thead><tr><th>#</th><th>الجهاز</th><th>الكود</th><th>الحالة</th><th>تاريخ التنفيذ</th><th></th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      </div>`;
  });

  document.getElementById('view-monthly').innerHTML = `
    <div style="margin-bottom:8px">
      <div class="filter-row">${monthBtns}</div>
    </div>
    <div class="card no-print" style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
        <div>
          <div style="font-size:14px;font-weight:700">${MONTHS_AR[m]} ${cy}</div>
          <div style="font-size:11px;color:var(--text2)">${mInsts.length} جهاز — ${done} تم · ${mInsts.length-done} متبقي</div>
        </div>
        ${!isManager?`<div style="display:flex;gap:5px;flex-wrap:wrap">
          <button class="btn btn-success btn-sm" onclick="markMonthDone(${m})">✅ تنفيذ الشهر كله</button>
          <button class="btn btn-primary btn-sm" onclick="openAddInst(${m})">+ جهاز</button>
          <button class="btn btn-sm" onclick="openView('transfer')">🔄 ترحيل</button>
        </div>`:''}
      </div>
    </div>
    ${mInsts.length===0?`<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">لا توجد أجهزة في ${MONTHS_AR[m]}</div>${!isManager?`<button class="btn btn-primary" style="margin-top:10px" onclick="openAddInst(${m})">+ إضافة جهاز</button>`:''}</div>`:''}
    ${sectionsHtml}
  `;
}

function toggleSection(name) {
  const key = name;
  const id = 'sec-'+btoa(unescape(encodeURIComponent(name))).replace(/[^a-zA-Z0-9]/g,'');
  const el = document.getElementById(id);
  if (!el) return;
  if (collapsedSections.has(key)) { collapsedSections.delete(key); el.style.display=''; }
  else { collapsedSections.add(key); el.style.display='none'; }
}

function markDone(id, date) {
  const inst = state.instruments.find(i=>i.id===id);
  if (!inst) return;
  if (date) { inst.status='done'; inst.executedDate=date; }
  else { inst.status= inst.month<(new Date().getMonth()+1)?'late':'due'; inst.executedDate=''; }
  saveToStorage(); renderMonthly(); toast('✅ تم التحديث');
}

function markMonthDone(m) {
  const cy = state.settings.currentYear;
  const mInsts = state.instruments.filter(i=>i.month===m && i.year===cy && i.status!=='faulty');
  const done = mInsts.filter(i=>i.status==='done').length;
  const pending = mInsts.filter(i=>i.status!=='done').length;
  const today = new Date().toISOString().split('T')[0];

  let itemsHtml = mInsts.map(inst=>`
    <div class="transfer-item ${inst.status==='done'?'sel':''}" id="bm-${inst.id}" onclick="toggleBatchMark(${inst.id})">
      <div class="t-check" id="bm-chk-${inst.id}">${inst.status==='done'?'✓':''}</div>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:500">${inst.item}</div>
        <div style="font-size:10px;color:var(--text3)">${inst.section} — ${inst.code}</div>
      </div>
      <span class="badge ${STATUS_CFG[inst.status]?.cls||'b-pending'}" style="font-size:10px">${STATUS_CFG[inst.status]?.label||''}</span>
    </div>`).join('');

  // Initialize batch selection from current status
  window._batchMonth = m;
  window._batchSelected = new Set(mInsts.filter(i=>i.status==='done').map(i=>i.id));

  showModal(`
    <div class="modal-title">⚙️ تنفيذ أجهزة ${MONTHS_AR[m]}</div>
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <button class="btn btn-success btn-sm" onclick="batchSelectAll()">✅ تحديد الكل</button>
      <button class="btn btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="batchDeselectAll()">↩ إلغاء الكل</button>
      <button class="btn btn-primary btn-sm" onclick="batchToggleDone()">تبديل المحدد ↕</button>
    </div>
    <div style="font-size:11px;color:var(--text2);margin-bottom:6px">
      ${mInsts.length} جهاز — ${done} تم تنفيذه · ${pending} لم يتم
    </div>
    <div class="transfer-list" style="max-height:320px">${itemsHtml}</div>
    <div class="form-group" style="margin-top:10px">
      <label class="form-label">تاريخ التنفيذ للمحدد</label>
      <input type="date" class="form-input" id="batch-date" value="${today}"/>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-success" onclick="applyBatchMark()">💾 تطبيق</button>
    </div>
  `);
}

function toggleBatchMark(id) {
  if (window._batchSelected.has(id)) window._batchSelected.delete(id);
  else window._batchSelected.add(id);
  const el = document.getElementById('bm-'+id);
  const chk = document.getElementById('bm-chk-'+id);
  if(el) el.classList.toggle('sel', window._batchSelected.has(id));
  if(chk) chk.textContent = window._batchSelected.has(id)?'✓':'';
}

function batchSelectAll() {
  const cy = state.settings.currentYear;
  const m = window._batchMonth;
  state.instruments.filter(i=>i.month===m&&i.year===cy&&i.status!=='faulty').forEach(i=>{
    window._batchSelected.add(i.id);
    const el=document.getElementById('bm-'+i.id);
    const chk=document.getElementById('bm-chk-'+i.id);
    if(el) el.classList.add('sel');
    if(chk) chk.textContent='✓';
  });
}

function batchDeselectAll() {
  window._batchSelected.clear();
  document.querySelectorAll('[id^="bm-"]').forEach(el=>{
    if(el.classList.contains('transfer-item')) el.classList.remove('sel');
    if(el.id.startsWith('bm-chk-')) el.textContent='';
  });
}

function batchToggleDone() {
  // Toggle: selected = done become not-done, not-done become done
  const cy = state.settings.currentYear;
  const m = window._batchMonth;
  const mInsts = state.instruments.filter(i=>i.month===m&&i.year===cy&&i.status!=='faulty');
  const notDone = mInsts.filter(i=>!window._batchSelected.has(i.id));
  window._batchSelected.clear();
  notDone.forEach(i=>window._batchSelected.add(i.id));
  mInsts.forEach(inst=>{
    const sel = window._batchSelected.has(inst.id);
    const el=document.getElementById('bm-'+inst.id);
    const chk=document.getElementById('bm-chk-'+inst.id);
    if(el) el.classList.toggle('sel',sel);
    if(chk) chk.textContent=sel?'✓':'';
  });
}

function applyBatchMark() {
  const date = document.getElementById('batch-date').value;
  const cy = state.settings.currentYear;
  const m = window._batchMonth;
  const now = new Date(); const cm = now.getMonth()+1;
  state.instruments.forEach(inst=>{
    if(inst.month===m && inst.year===cy && inst.status!=='faulty'){
      if(window._batchSelected.has(inst.id)){
        inst.status='done'; inst.executedDate=date||new Date().toISOString().split('T')[0];
      } else {
        // Mark as not done
        inst.status = inst.month<cm?'late':inst.month===cm?'due':'pending';
        inst.executedDate='';
      }
    }
  });
  saveToStorage(); closeModal(); renderMonthly();
  toast(`✅ تم التحديث — ${window._batchSelected.size} جهاز نُفِّذ`);
}

function toggleCertReceived(id) {
  const inst = state.instruments.find(i=>i.id===id);
  if (!inst) return;
  inst.certReceived = !inst.certReceived;
  saveToStorage(); render(state.currentView);
  toast(inst.certReceived ? '✅ تم تسجيل وصول الشهادة' : '↩ تم إلغاء تسجيل الشهادة');
}

function markFaulty(id) {
  const inst = state.instruments.find(i=>i.id===id);
  if (!inst || !confirm(`تأكيد وضع "${inst.item}" كمعطل؟`)) return;
  inst.status = 'faulty';
  const faultyInst = {...inst};
  state.faulty.push(faultyInst);
  state.instruments = state.instruments.filter(i=>i.id!==id);
  saveToStorage(); renderMonthly(); toast('🔧 تم وضع الجهاز كمعطل');
}

// ========== SEARCH / ALL ==========
let searchText = '';
let searchStatus = 'all';
let searchSection = 'all';

function renderSearch() {
  const insts = state.instruments;
  const sections = [...new Set(insts.map(i=>i.section))].sort();

  let filtered = insts;
  if (searchStatus!=='all') filtered = filtered.filter(i=>i.status===searchStatus);
  if (searchSection!=='all') filtered = filtered.filter(i=>i.section===searchSection);
  if (searchText.trim()) {
    const q = searchText.toLowerCase();
    filtered = filtered.filter(i=>`${i.item} ${i.code} ${i.location} ${i.section}`.toLowerCase().includes(q));
  }

  const statusFilters = [
    {k:'all',label:'الكل'},
    {k:'done',label:'✅ تم'},
    {k:'due',label:'⏰ مستحق'},
    {k:'late',label:'⚠️ متأخر'},
    {k:'pending',label:'⏳ قادم'},
  ].map(f=>`<button class="filter-chip ${searchStatus===f.k?'active':''}" onclick="searchStatus='${f.k}';renderSearch()">${f.label}</button>`).join('');

  const secFilters = `<button class="filter-chip ${searchSection==='all'?'active':''}" onclick="searchSection='all';renderSearch()">كل الأقسام</button>`
    + sections.map(s=>`<button class="filter-chip ${searchSection===s?'active':''}" onclick="searchSection='${s.replace(/'/g,"\\'")}';renderSearch()">${s}</button>`).join('');

  let rows = filtered.map((inst,idx)=>`
    <tr>
      <td style="color:var(--text3);width:28px">${idx+1}</td>
      <td>
        <div style="font-weight:500;font-size:12px">${inst.item}</div>
        <div style="font-size:10px;color:var(--text3)">${inst.section}</div>
      </td>
      <td style="font-size:11px;color:var(--text2)">${inst.location}</td>
      <td class="code-cell">${inst.code}</td>
      <td style="font-size:11px;color:var(--text2)">${MONTHS_AR[inst.month]}</td>
      <td><span class="badge ${STATUS_CFG[inst.status]?.cls||'b-pending'}">${STATUS_CFG[inst.status]?.label||inst.status}</span></td>
      <td style="font-size:11px;color:var(--success-dark)">${inst.executedDate||'—'}</td>
      ${!state.isManager?`<td><div style="display:flex;gap:3px"><button class="btn btn-xs" onclick="openInstModal(${inst.id})">✏️</button><button class="btn btn-xs btn-danger" onclick="quickDeleteInst(${inst.id})" title="حذف">🗑</button></div></td>`:'<td></td>'}
    </tr>`).join('');

  document.getElementById('view-search').innerHTML = `
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" class="search-input" id="search-input" placeholder="بحث باسم الجهاز أو الكود أو الموقع..." value="${searchText}" 
        oninput="searchText=this.value;renderSearch()" autocomplete="off"/>
    </div>
    <div class="filter-row">${statusFilters}</div>
    <div class="filter-row">${secFilters}</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:6px">${filtered.length} جهاز</div>
    <div class="card" style="padding:0;overflow:auto">
      <table>
        <thead><tr><th>#</th><th>الجهاز</th><th>الموقع</th><th>الكود</th><th>الشهر</th><th>الحالة</th><th>التنفيذ</th><th></th></tr></thead>
        <tbody>${rows||'<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">لا توجد نتائج</div></div></td></tr>'}</tbody>
      </table>
    </div>
  `;
  // Keep focus on search without keyboard dismiss
  const inp = document.getElementById('search-input');
  if (inp && document.activeElement !== inp && searchText) {
    const len = searchText.length;
    inp.focus(); inp.setSelectionRange(len, len);
  }
}

// ========== ADD / EDIT INSTRUMENT ==========
function openAddInst(month) {
  const sections = [...new Set(state.instruments.map(i=>i.section))].sort();
  const secOpts = sections.map(s=>`<option value="${s}">${s}</option>`).join('');
  const monthOpts = Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===month?'selected':''}>${MONTHS_AR[i+1]}</option>`).join('');
  showModal(`
    <div class="modal-title">➕ إضافة جهاز جديد</div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">اسم الجهاز *</label>
        <input class="form-input" id="fi-item" placeholder="مثال: Data Logger"/>
      </div>
      <div class="form-group">
        <label class="form-label">الكود</label>
        <input class="form-input" id="fi-code" placeholder="مثال: SGC-C19/DL01" style="direction:ltr"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">الموقع</label>
      <input class="form-input" id="fi-location" placeholder="مثال: Encapsulation 1"/>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">القسم *</label>
        <select class="form-select" id="fi-section">
          <option value="">-- اختر --</option>
          ${secOpts}
          <option value="__new__">➕ قسم جديد...</option>
        </select>
        <input class="form-input hidden" id="fi-newsec" placeholder="اسم القسم الجديد" style="margin-top:5px"/>
      </div>
      <div class="form-group">
        <label class="form-label">الشهر</label>
        <select class="form-select" id="fi-month">${monthOpts}</select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">الرقم التسلسلي / السيريال نمبر (إن وُجد)</label>
      <input class="form-input" id="fi-serial" placeholder="اتركه فارغاً إذا غير موجود" style="direction:ltr"/>
    </div>
    <div class="form-group">
      <label class="form-label">ملاحظات</label>
      <input class="form-input" id="fi-notes" placeholder="أي ملاحظات..."/>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveNewInst()">💾 حفظ</button>
    </div>
  `);
  document.getElementById('fi-section').addEventListener('change', function(){
    document.getElementById('fi-newsec').classList.toggle('hidden', this.value!=='__new__');
  });
}

function saveNewInst() {
  let section = document.getElementById('fi-section').value;
  if (section==='__new__') section = document.getElementById('fi-newsec').value.trim();
  const item = document.getElementById('fi-item').value.trim();
  if (!item||!section) { alert('الاسم والقسم مطلوبان'); return; }
  const month = parseInt(document.getElementById('fi-month').value);
  const now = new Date(); const cm = now.getMonth()+1;
  const newInst = {
    id: state.nextId++, section, item,
    location: document.getElementById('fi-location').value.trim(),
    code: document.getElementById('fi-code').value.trim(),
    month, year: state.settings.currentYear,
    status: month<cm?'done':month===cm?'due':'pending',
    executedDate: month<cm ? new Date().toISOString().split('T')[0] : '',
    notes: document.getElementById('fi-notes').value.trim(),
    serial: document.getElementById('fi-serial').value.trim(),
    addedBy: 'user', certReceived: false
  };
  state.instruments.push(newInst);
  saveToStorage(); closeModal();
  state.currentMonth = month;
  renderMonthly(); toast('✅ تم إضافة الجهاز');
}

function openInstModal(id) {
  const inst = state.instruments.find(i=>i.id===id);
  if (!inst) return;
  const sections = [...new Set(state.instruments.map(i=>i.section))].sort();

function saveEditInst(id) {
  const inst = state.instruments.find(i=>i.id===id);
  if (!inst) return;
  let section = document.getElementById('ei-section').value;
  if (section==='__new__') section = document.getElementById('ei-newsec').value.trim()||inst.section;
  inst.section = section;
  inst.item = document.getElementById('ei-item').value.trim()||inst.item;
  inst.code = document.getElementById('ei-code').value.trim();
  inst.location = document.getElementById('ei-location').value.trim();
  inst.month = parseInt(document.getElementById('ei-month').value);
  inst.status = document.getElementById('ei-status').value;
  inst.executedDate = document.getElementById('ei-date').value;
  inst.notes = document.getElementById('ei-notes').value.trim();
  inst.serial = document.getElementById('ei-serial').value.trim();
  saveToStorage(); closeModal(); render(state.currentView); toast('✅ تم الحفظ');
}

function quickDeleteInst(id) {
  const inst = state.instruments.find(i=>i.id===id);
  if (!inst) return;
  if (!confirm(`حذف "${inst.item}" (${inst.code}) نهائياً؟`)) return;
  state.instruments = state.instruments.filter(i=>i.id!==id);
  saveToStorage(); render(state.currentView); toast('🗑 تم حذف الجهاز');
}

function deleteInst(id) {
  if (!confirm('حذف هذا الجهاز نهائياً؟')) return;
  state.instruments = state.instruments.filter(i=>i.id!==id);
  saveToStorage(); closeModal(); render(state.currentView); toast('🗑 تم الحذف');
}

// ========== PHOTOS ==========
function openPhotos(id) {
  const inst = state.instruments.find(i=>i.id===id) || state.faulty.find(i=>i.id===id);
  if (!inst) return;
  if (!state.photos[id]) state.photos[id] = [];
  renderPhotosModal(id, inst.item);
}

function renderPhotosModal(id, itemName) {
  const photos = state.photos[id] || [];
  let slots = '';
  for (let i=0; i<4; i++) {
    if (photos[i]) {
      slots += `<div class="photo-slot">
        <img src="${photos[i]}" alt="شهادة ${i+1}"/>
        <button class="photo-del" onclick="delPhoto(${id},${i})">✕</button>
      </div>`;
    } else {
      slots += `<div class="photo-slot" onclick="addPhoto(${id},${i})">
        <span style="font-size:20px">📷</span>
        <span>إضافة</span>
      </div>`;
    }
  }
  showModal(`
    <div class="modal-title">📷 شهادات المعايرة — ${itemName}</div>
    <div class="photo-grid">${slots}</div>
    <div style="margin-top:10px;font-size:11px;color:var(--text3);text-align:center">اضغط على الإطار لإضافة صورة — يمكن إضافة حتى 4 صور</div>
    <div class="modal-footer">
      <button class="btn btn-block" onclick="closeModal()">إغلاق</button>
    </div>
  `);
}

function addPhoto(id, idx) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      if (!state.photos[id]) state.photos[id] = [];
      state.photos[id][idx] = ev.target.result;
      saveToStorage();
      const inst = state.instruments.find(i=>i.id===id)||state.faulty.find(i=>i.id===id);
      renderPhotosModal(id, inst?inst.item:'');
      toast('✅ تم إضافة الصورة');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function delPhoto(id, idx) {
  if (!state.photos[id]) return;
  state.photos[id][idx] = null;
  saveToStorage();
  const inst = state.instruments.find(i=>i.id===id)||state.faulty.find(i=>i.id===id);
  renderPhotosModal(id, inst?inst.item:'');
}

// ========== TRANSFER ==========
let transferSelected = new Set();
let transferFrom = null;

function renderTransfer() {
  const months = Array.from({length:12},(_,i)=>i+1);
  const cy = state.settings.currentYear;
  let fromOpts = months.map(m=>`<option value="${m}" ${m===state.currentMonth?'selected':''}>${MONTHS_AR[m]}</option>`).join('');
  let toOpts = months.map(m=>`<option value="${m}" ${m===(state.currentMonth%12)+1?'selected':''}>${MONTHS_AR[m]}</option>`).join('');

  const fromMonth = transferFrom || state.currentMonth;
  const mInsts = state.instruments.filter(i=>i.month===fromMonth && i.year===cy && i.status!=='done');
  transferSelected = new Set();

  let listHtml = mInsts.length===0
    ? '<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">لا توجد أجهزة غير منفذة في هذا الشهر</div></div>'
    : mInsts.map(inst=>`
      <div class="transfer-item ${transferSelected.has(inst.id)?'sel':''}" id="tr-${inst.id}" onclick="toggleTransfer(${inst.id})">
        <div class="t-check">${transferSelected.has(inst.id)?'✓':''}</div>
        <div style="flex:1">
          <div style="font-size:12px;font-weight:500">${inst.item}</div>
          <div style="font-size:10px;color:var(--text3)">${inst.section} — ${inst.code}</div>
        </div>
      </div>`).join('');

  document.getElementById('view-transfer').innerHTML = `
    <div class="card">
      <div class="card-title">🔄 ترحيل الأجهزة بين الشهور</div>
      <div class="form-grid" style="margin-bottom:10px">
        <div class="form-group">
          <label class="form-label">من شهر</label>
          <select class="form-select" id="tr-from" onchange="transferFrom=parseInt(this.value);renderTransfer()">${fromOpts}</select>
        </div>
        <div class="form-group">
          <label class="form-label">إلى شهر</label>
          <select class="form-select" id="tr-to">${toOpts}</select>
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
        <button class="btn btn-sm btn-primary" onclick="selectAllTransfer()">تحديد الكل</button>
        <button class="btn btn-sm" onclick="transferSelected=new Set();renderTransfer()">إلغاء التحديد</button>
      </div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:6px">الأجهزة غير المنفذة في ${MONTHS_AR[fromMonth]} (${mInsts.length})</div>
      <div class="transfer-list">${listHtml}</div>
      <div class="modal-footer" style="border:none;padding-top:10px">
        <button class="btn btn-warning btn-block" onclick="doTransfer()">🔄 ترحيل المحدد (${transferSelected.size})</button>
      </div>
    </div>
  `;
}

function toggleTransfer(id) {
  if (transferSelected.has(id)) transferSelected.delete(id);
  else transferSelected.add(id);
  const el = document.getElementById('tr-'+id);
  if (el) {
    el.classList.toggle('sel', transferSelected.has(id));
    el.querySelector('.t-check').textContent = transferSelected.has(id)?'✓':'';
  }
  const btn = document.querySelector('#view-transfer .btn-warning');
  if (btn) btn.textContent = `🔄 ترحيل المحدد (${transferSelected.size})`;
}

function selectAllTransfer() {
  const cy = state.settings.currentYear;
  const fromMonth = transferFrom || state.currentMonth;
  state.instruments.filter(i=>i.month===fromMonth&&i.year===cy&&i.status!=='done').forEach(i=>transferSelected.add(i.id));
  renderTransfer();
}

function doTransfer() {
  if (transferSelected.size===0) { toast('❗ لم تحدد أي جهاز'); return; }
  const toMonth = parseInt(document.getElementById('tr-to').value);
  const fromMonth = transferFrom || state.currentMonth;
  if (toMonth===fromMonth) { toast('❗ الشهر المصدر والهدف متشابهان'); return; }
  if (!confirm(`ترحيل ${transferSelected.size} جهاز من ${MONTHS_AR[fromMonth]} إلى ${MONTHS_AR[toMonth]}؟`)) return;
  const now = new Date(); const cm = now.getMonth()+1;
  transferSelected.forEach(id=>{
    const inst = state.instruments.find(i=>i.id===id);
    if (inst) {
      inst.month = toMonth;
      inst.status = toMonth<cm?'late':toMonth===cm?'due':'pending';
      inst.executedDate='';
    }
  });
  saveToStorage(); toast(`✅ تم ترحيل ${transferSelected.size} جهاز إلى ${MONTHS_AR[toMonth]}`);
  transferSelected = new Set();
  renderTransfer();
}

function restoreFromFaulty(id) {

  saveToStorage(); renderFaulty(); toast('♻️ تم استعادة الجهاز');
}

function deleteFaulty(id) {
  if (!confirm('حذف نهائي؟')) return;
  state.faulty = state.faulty.filter(i=>i.id!==id);
  saveToStorage(); renderFaulty(); toast('🗑 تم الحذف');

function renderArchive() {
  const years = Object.keys(state.archive).sort((a,b)=>b-a);

    html += `<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">لا يوجد أرشيف بعد</div></div>`;
  } else {
    years.forEach(yr=>{
      const yData = state.archive[yr];
      const months = Object.keys(yData).sort((a,b)=>a-b);
      const total = Object.values(yData).reduce((s,a)=>s+a.length,0);
      html += `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="font-size:14px;font-weight:700">📅 سنة ${yr} <span class="badge b-pending">${total} جهاز</span></div>
          ${!state.isManager?`<button class="btn btn-xs btn-danger" onclick="deleteArchiveYear(${yr})">🗑 حذف السنة</button>`:''}
        </div>
        <div class="months-grid">
          ${months.map(m=>`
            <div class="month-card" onclick="viewArchiveMonth(${yr},${m})">
              <div class="month-name">${MONTHS_AR[parseInt(m)]}</div>
              <div class="month-prog">${yData[m].length} جهاز</div>
              ${!state.isManager?`<button class="btn btn-xs btn-danger no-print" style="margin-top:4px;width:100%" onclick="event.stopPropagation();deleteArchiveMonth(${yr},${m})">حذف الشهر</button>`:''}
            </div>`).join('')}
        </div>
      </div>`;
    });
  }
  document.getElementById('view-archive').innerHTML = html;
}

function viewArchiveMonth(yr, m) {
  const data = state.archive[yr]?.[m] || [];
  const sections = [...new Set(data.map(i=>i.section))].sort();
  let secHtml = sections.map(sec=>{
    const si = data.filter(i=>i.section===sec);
    return `<div class="section-block">
      <div class="section-hdr"><div class="section-name">${sec}</div><div class="section-meta"><span class="badge b-done">${si.length} جهاز</span></div></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>الجهاز</th><th>الموقع</th><th>الكود</th><th>الحالة</th><th>التنفيذ</th></tr></thead>
        <tbody>${si.map((inst,idx)=>`<tr>
          <td style="color:var(--text3)">${idx+1}</td>
          <td><div style="font-size:12px;font-weight:500">${inst.item}</div></td>
          <td style="font-size:11px;color:var(--text2)">${inst.location}</td>
          <td class="code-cell">${inst.code}</td>
          <td><span class="badge ${STATUS_CFG[inst.status]?.cls||'b-done'}">${STATUS_CFG[inst.status]?.label||inst.status}</span></td>
          <td style="font-size:11px;color:var(--success-dark)">${inst.executedDate||'—'}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  }).join('');

  showModal(`
    <div class="modal-title">📦 أرشيف — ${MONTHS_AR[m]} ${yr}</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:10px">${data.length} جهاز</div>
    ${secHtml}

}

function deleteArchiveMonth(yr, m) {
  if (!confirm(`حذف أرشيف ${MONTHS_AR[m]} ${yr}؟`)) return;
  if (state.archive[yr]) delete state.archive[yr][m];
  saveToStorage(); renderArchive(); toast('🗑 تم حذف الشهر من الأرشيف');
}

function deleteArchiveYear(yr) {
  if (!confirm(`حذف كل أرشيف سنة ${yr}؟`)) return;
  delete state.archive[yr];
  saveToStorage(); renderArchive(); toast('🗑 تم حذف السنة من الأرشيف');
}

function addNewYear() {
  const newYear = state.settings.currentYear + 1;
  if (!confirm(`إضافة سنة ${newYear}؟ سيتم ترحيل بيانات ${state.settings.currentYear} إلى الأرشيف.`)) return;
  // Archive current year
  const cy = state.settings.currentYear;
  if (!state.archive[cy]) state.archive[cy] = {};
  state.instruments.forEach(inst => {
    if (inst.year===cy) {
      const m = String(inst.month);
      if (!state.archive[cy][m]) state.archive[cy][m] = [];
      state.archive[cy][m].push({...inst});
    }
  });
  // Delete archive of cy-2
  const toDelete = cy - 1;
  if (state.archive[toDelete]) {
    delete state.archive[toDelete];
    toast(`🗑 تم حذف أرشيف ${toDelete} تلقائياً`);
  }
  // Create new year instruments (copy structure, reset status)
  state.instruments = state.instruments.filter(i=>i.year!==cy);
  RAW_DATA.forEach((d,i)=>{
    state.instruments.push({
      id: state.nextId++, section:d[0], item:d[1], location:d[2], month:d[3], code:d[4],
      year: newYear, status:'pending', executedDate:'', notes:'', addedBy:'system'
    });
  });
  state.settings.currentYear = newYear;
  state.currentMonth = 1;
  document.getElementById('hdr-sub').textContent = `ARABCAPS — ${newYear}`;
  saveToStorage(); openView('dashboard'); toast(`✅ تم إضافة سنة ${newYear}`);
}

function showChangePassword(type) {
  const titles = {admin:'كلمة سر الدخول الرئيسية', manager:'كلمة سر المدير', settings:'كلمة سر الإعدادات'};
  showModal(`

      <label class="form-label">كلمة السر الجديدة</label>
      <input type="password" class="form-input" id="new-pw1" placeholder="أدخل كلمة السر الجديدة" style="text-align:center;letter-spacing:4px"/>
    </div>
    <div class="form-group">
      <label class="form-label">تأكيد كلمة السر</label>
      <input type="password" class="form-input" id="new-pw2" placeholder="أعد الكتابة" style="text-align:center;letter-spacing:4px"/>
    </div>
    <div id="pw-change-err" style="color:var(--danger);font-size:12px;margin-bottom:8px"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="confirmChangePassword('${type}')">💾 حفظ</button>
    </div>
  `);
}

async function confirmChangePassword(type) {
  const pw1 = document.getElementById('new-pw1').value;
  const pw2 = document.getElementById('new-pw2').value;
  const err = document.getElementById('pw-change-err');
  if (!pw1) { err.textContent='❌ أدخل كلمة السر'; return; }
  if (pw1!==pw2) { err.textContent='❌ كلمتا السر غير متطابقتين'; return; }
  if (pw1.length<3) { err.textContent='❌ كلمة السر قصيرة جداً (3 أحرف على الأقل)'; return; }
  const h = await hashStr(pw1);
  const keyMap = {admin:'adminPw', manager:'managerPw', settings:'settingsPw'};
  if (keyMap[type]) state.settings[keyMap[type]] = h;
  saveToStorage(); closeModal(); toast('✅ تم تغيير كلمة السر');
}

function toast(msg, dur=2500) {

  setTimeout(()=>el.classList.remove('show'), dur);
}

function previewMissingCerts() {
  const company = document.getElementById('mc-company').value.trim() || 'شركة المعايرة';

  const monthSel = document.getElementById('mc-month').value;

  const cy = state.settings.currentYear;
  const companyName = state.settings.companyName || 'ARABCAPS';

  let pool = state.instruments.filter(i=>i.year===cy && i.status==='done');
  if (monthSel !== 'all') pool = pool.filter(i=>i.month===parseInt(monthSel));
  const missing = pool.filter(i=>!i.certReceived);

  if (pool.length === 0) {
    document.getElementById('missingcerts-preview').innerHTML = `<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">لا توجد أجهزة تم تنفيذ معايرتها بعد${monthSel!=='all'?' في هذا الشهر':''} — لا يوجد شيء لطلب شهادته</div></div>`;

      </table>
      <p style="font-size:12px;margin-top:10px">وتفضلوا بقبول فائق التقدير والاحترام،،،</p>
      <div style="margin-top:20px;font-size:12px">
        <div>مسؤول المعايرة</div>
        ${officer?`<div style="font-weight:600">${officer}</div>`:''}
        <div style="color:#555">${companyName}</div>

    </div>
  `);
}

function uploadCompanyLogo() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      state.settings.companyLogo = ev.target.result;
      saveToStorage();
      applyBranding();
      showCompanySettings();
      toast('✅ تم اختيار الشعار وتحديثه في الواجهة');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function removeCompanyLogo() {
  state.settings.companyLogo = '';
  saveToStorage();
  applyBranding();
  showCompanySettings();
}

function saveCompanySettings() {
  state.settings.companyName = document.getElementById('cs-name').value.trim() || 'ARABCAPS';
  state.settings.firebaseConfig = document.getElementById('cs-firebase').value.trim();
  saveToStorage();
  applyBranding();
  closeModal(); renderSettings(); toast('✅ تم حفظ بيانات الشركة');
}

// ========== UPLOAD NEW INSTRUCTION (EXCEL) ==========
function showUploadInstruction() {
  showModal(`
    <div class="modal-title">📥 رفع تعليمة جديدة</div>
    <div style="background:var(--danger-light);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--danger-dark)">
      ⚠️ تحذير: هذا الإجراء سيحذف كل الأجهزة الحالية ويستبدلها بالملف الجديد. الأرشيف والمعطلات لن يتأثروا.
    </div>
    <div class="form-group">
      <label class="form-label">اختر ملف Excel أو CSV</label>
      <div style="font-size:11px;color:var(--text3);margin-bottom:8px">
        يجب أن يحتوي الملف على 5 أعمدة بالترتيب: القسم — الجهاز — الموقع — الشهر (رقم 1-12) — الكود
      </div>
      <input type="file" id="upload-file-input" accept=".xlsx,.xls,.csv" class="form-input" style="padding:8px"/>
    </div>
    <div id="upload-preview" style="max-height:200px;overflow-y:auto;margin-top:10px"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="previewUploadedFile()">👁 معاينة</button>
      <button class="btn btn-warning hidden" id="btn-confirm-upload" onclick="confirmUploadInstruction()">✅ تأكيد الاستبدال</button>
    </div>
  `);
}

let pendingUploadData = null;

function previewUploadedFile() {
  const fileInput = document.getElementById('upload-file-input');
  const file = fileInput.files[0];
  if (!file) { toast('❗ اختر ملف أولاً'); return; }

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type:'array'});
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1});

      const parsed = [];
      rows.forEach(r => {
        if (!r || r.length < 5) return;
        const [section, item, location, month, code] = r;
        if (!section || !item) return;
        const m = parseInt(month);
        if (isNaN(m) || m < 1 || m > 12) return;
        parsed.push({section: String(section).trim(), item: String(item).trim(), location: String(location||'').trim(), month: m, code: String(code||'').trim()});
      });

      if (parsed.length === 0) {
        document.getElementById('upload-preview').innerHTML = '<div style="color:var(--danger);font-size:12px">❌ لم يتم العثور على بيانات صحيحة في الملف</div>';
        return;
      }

      pendingUploadData = parsed;
      let preview = `<div style="font-size:12px;color:var(--success-dark);font-weight:600;margin-bottom:6px">✅ تم قراءة ${parsed.length} جهاز</div>`;
      preview += '<table style="width:100%;font-size:11px;border-collapse:collapse"><thead><tr><th style="text-align:right;padding:4px;border-bottom:1px solid #ddd">القسم</th><th style="text-align:right;padding:4px;border-bottom:1px solid #ddd">الجهاز</th><th style="text-align:right;padding:4px;border-bottom:1px solid #ddd">الشهر</th></tr></thead><tbody>';
      parsed.slice(0,8).forEach(p=>{
        preview += `<tr><td style="padding:4px;border-bottom:1px solid #f0f0f0">${p.section}</td><td style="padding:4px;border-bottom:1px solid #f0f0f0">${p.item}</td><td style="padding:4px;border-bottom:1px solid #f0f0f0">${MONTHS_AR[p.month]}</td></tr>`;
      });
      if (parsed.length > 8) preview += `<tr><td colspan="3" style="padding:4px;color:var(--text3);text-align:center">... و ${parsed.length-8} جهاز آخر</td></tr>`;
      preview += '</tbody></table>';
      document.getElementById('upload-preview').innerHTML = preview;
      document.getElementById('btn-confirm-upload').classList.remove('hidden');
    } catch(err) {
      document.getElementById('upload-preview').innerHTML = '<div style="color:var(--danger);font-size:12px">❌ خطأ في قراءة الملف — تأكد أن التنسيق صحيح</div>';
    }
  };
  reader.readAsArrayBuffer(file);
}

function confirmUploadInstruction() {
  if (!pendingUploadData || !pendingUploadData.length) return;
  if (!confirm(`تأكيد استبدال كل الأجهزة الحالية بـ ${pendingUploadData.length} جهاز جديد؟`)) return;

  const now = new Date(); const cm = now.getMonth()+1;
  const cy = state.settings.currentYear;
  state.instruments = pendingUploadData.map((d,i)=>({
    id: state.nextId++, section:d.section, item:d.item, location:d.location, month:d.month, code:d.code,
    year: cy,
    status: d.month<cm?'done':d.month===cm?'due':'pending',
    executedDate: d.month<cm?new Date().toISOString().split('T')[0]:'',
    notes:'', addedBy:'upload'
  }));
  pendingUploadData = null;
  saveToStorage(); closeModal(); openView('dashboard');
  toast('✅ تم استبدال التعليمة بنجاح');
}

// ========== PDF DOWNLOAD, SHARE & PRINT HISTORY ==========
function downloadPrintPdf(elId, title) {
  const el = document.getElementById(elId);
  if (!el) { toast('❗ اعمل معاينة أولاً'); return; }
  if (typeof html2pdf === 'undefined') { toast('❌ تعذر تحميل أداة PDF — تأكد من الاتصال بالإنترنت'); return; }
  toast('⏳ جاري تجهيز الملف...');
  const opt = {
    margin: 10,
    filename: `${title}_${new Date().toISOString().split('T')[0]}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  html2pdf().set(opt).from(el).save().then(()=>{
    savePrintHistory(title, el.innerHTML);
    toast('✅ تم تحميل الملف');
  }).catch(()=>{ toast('❌ حدث خطأ أثناء إنشاء الملف'); });
}

async function sharePrint(elId, title) {
  const el = document.getElementById(elId);
  if (!el) { toast('❗ اعمل معاينة أولاً'); return; }
  savePrintHistory(title, el.innerHTML);
  const text = el.innerText || el.textContent || title;
  if (navigator.share) {
    try {
      await navigator.share({ title: title, text: text });
      toast('✅ تم فتح خيارات المشاركة');
    } catch(e) { /* user cancelled */ }
  } else {
    toast('⚠️ المشاركة غير مدعومة على هذا الجهاز — استخدم تحميل PDF بدلاً منها');
  }
}

function savePrintHistory(title, htmlContent) {
  if (!state.printHistory) state.printHistory = [];
  state.printHistory.unshift({
    id: Date.now(),
    title: title,
    date: new Date().toLocaleString('ar-EG'),
    content: htmlContent
  });
  if (state.printHistory.length > 50) state.printHistory = state.printHistory.slice(0,50);
  saveToStorage();
}

function renderHistory() {
  const hist = state.printHistory || [];
  let html = `<div class="card no-print">
    <div class="card-title">🗂️ سجل المطبوعات <span class="badge b-pending">${hist.length}</span></div>
    <div style="font-size:11px;color:var(--text3)">نسخة من كل عرض سعر أو طلب شهادات أو تعليمة تم طباعتها أو تحميلها أو مشاركتها</div>
    ${hist.length && !state.isManager ? `<button class="btn btn-danger btn-sm" style="margin-top:8px" onclick="clearPrintHistory()">🗑 مسح السجل</button>`:''}
  </div>`;

  if (hist.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">🗂️</div><div class="empty-text">لا يوجد سجل مطبوعات بعد</div></div>`;
  } else {
    hist.forEach(h => {
      html += `<div class="card" style="cursor:pointer" onclick="viewHistoryItem(${h.id})">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:13px;font-weight:600">${h.title}</div>
            <div style="font-size:11px;color:var(--text3)">${h.date}</div>
          </div>
          <span style="color:var(--text3)">›</span>
        </div>
      </div>`;
    });
  }
  document.getElementById('view-history').innerHTML = html;
}

function viewHistoryItem(id) {
  const item = (state.printHistory||[]).find(h=>h.id===id);
  if (!item) return;
  showModal(`
    <div class="modal-title">🗂️ ${item.title}</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:10px">${item.date}</div>
    <div class="quote-paper">${item.content}</div>
    <div class="modal-footer">
      <button class="btn btn-block" onclick="closeModal()">إغلاق</button>
    </div>
  `);
}

function clearPrintHistory() {
  if (!confirm('مسح كل سجل المطبوعات؟')) return;
  state.printHistory = [];
  saveToStorage(); renderHistory(); toast('🗑 تم مسح السجل');
}

// ========== START ==========
init();
</script>
